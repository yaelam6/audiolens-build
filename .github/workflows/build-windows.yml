name: Build AudioLens v2 for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy soundfile customtkinter scipy pyinstaller pillow librosa

      - name: Create Windows icon
        run: python create_icon_win.py

      - name: Build with PyInstaller
        run: python -m PyInstaller AudioLens-Windows-v2.spec

      - name: Package as zip
        shell: pwsh
        run: Compress-Archive -Path dist\AudioLens -DestinationPath AudioLens-Windows-v2.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioLens-Windows-v2
          path: AudioLens-Windows-v2.zip
          retention-days: 60
